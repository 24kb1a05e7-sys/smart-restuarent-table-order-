
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div>
            <h1>🍽️ Smart Restaurant</h1>
            <p>Fresh food, smart ordering!</p>
        </div>
        <div class="cart-badge">
            🛒 Cart: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <h2>Welcome to Our Restaurant!</h2>
            <p>Select your table, choose your favorite food, and order online.</p>

            <label for="table-number">Select Table Number:</label>
            <select id="table-number">
                <option value="">Choose your table</option>
                <option value="1">Table 1</option>
                <option value="2">Table 2</option>
                <option value="3">Table 3</option>
                <option value="4">Table 4</option>
                <option value="5">Table 5</option>
                <option value="6">Table 6</option>
            </select>
        </section>

        <section class="menu-section">
            <h2>Our Menu</h2>

            <div class="menu-grid" id="menu-list"></div>
        </section>

        <section class="cart-section">
            <h2>🛒 Your Order</h2>
            <div id="cart-items">
                <p class="empty-cart">Your cart is empty.</p>
            </div>

            <div class="total">
                Total: ₹<span id="total-price">0.00</span>
            </div>

            <button id="place-order" class="order-btn">
                Place Order
            </button>

            <div id="order-message" role="status" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 Smart Restaurant | Happy Dining!</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
