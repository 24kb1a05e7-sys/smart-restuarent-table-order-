
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant Ordering System</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>🍽️ Smart Restaurant</h1>
        <div class="cart-badge">
            🛒 Cart: <span id="cart-count">0</span>
        </div>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome to Our Restaurant!</h2>
            <p>Choose your table, select your food, and place your order.</p>

            <label for="table-number">Select Table:</label>
            <select id="table-number">
                <option value="">-- Choose Table --</option>
                <option value="1">Table 1</option>
                <option value="2">Table 2</option>
                <option value="3">Table 3</option>
                <option value="4">Table 4</option>
                <option value="5">Table 5</option>
                <option value="6">Table 6</option>
            </select>
        </section>

        <section>
            <h2 class="section-title">Our Menu</h2>
            <div id="menu-list" class="menu-grid"></div>
        </section>

        <section class="cart-section">
            <h2>Your Order</h2>

            <div id="cart-items">
                <p class="empty-cart">Your cart is empty.</p>
            </div>

            <div class="total">
                Total: ₹<span id="total-price">0.00</span>
            </div>

            <button type="button" id="place-order" class="order-btn">
                Place Order
            </button>

            <p id="order-message" role="status" aria-live="polite"></p>
        </section>

    </main>

    <footer>
        <p>Smart Restaurant Ordering System</p>
    </footer>

</body>
</html>
